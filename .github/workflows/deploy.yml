name: Build and Push TaskFlow Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest 
      - name: EC2Conect
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:  ${{ secrets.EC2_SSH_KEY }}    
          port: 22
          script: |
            echo "Successfully connected to EC2!"
            docker --version
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            echo "pulled"
            sudo docker rm -f taskflow-contaimer || true
            echo docker old one removed
            sudo docker run -d --name taskflow-conatiner -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            echo container created

