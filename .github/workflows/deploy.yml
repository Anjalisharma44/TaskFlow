name: Build and Push TaskFlow Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy.yml'


  workflow_dispatch:

permissions:
  contents: read

jobs:

  # 1. Test frontend on multiple operating systems
  frontend-test:
    name: Frontend Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend HTML
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('Frontend'); files=list(p.rglob('*.html')) if p.exists() else []; print('HTML files:', len(files)); assert files, 'Frontend folder or HTML files missing'"

   frontend-build: 
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    needs: frontend-test

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME: taskflow-frontend
      IMAGE_TAG: latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Yahan tumhara existing commented build timer
      # aur build metrics ka block waise hi rakhna.

      - name: Build and push frontend
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Yahan tumhara existing commented deployment timer
      # waise hi rakhna.

      - name: Deploy frontend on EC2
        id: deploy
        if: steps.docker-build.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            sudo docker pull ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            sudo docker rm -f my_container_frontend || true
            sudo docker run -d \
              --name my_container_frontend \
              -p 80:80 \
              ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

