name: Build and Push TaskFlow Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest

      - name: Deploy frontend on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd /home/ec2-user/taskflow-deploy

            echo "Connected to EC2 successfully!"

            sudo docker compose pull frontend
            sudo docker compose up -d --no-deps frontend
            sudo docker compose ps frontend

            echo "Frontend deployment completed!"