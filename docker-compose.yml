
services:
  mysql:
    image: mysql:8.4
    container_name: taskflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - taskflow-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    image: anjalis007/taskflow-backend:latest
    container_name: taskflow-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/taskflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: taskuser
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    image: anjalis007/taskflow-frontend:latest
    container_name: taskflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  taskflow-data:
